<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="../assets/css/all.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <link rel="stylesheet" href="../assets/css/theme.css" />
    <link rel="shortcut icon" href="../assets/img/favicon.ico" />
    <title>Developer | Everything App Ronkin</title>
    <style>
      #preview-edit {
        margin: 10px;
        background-color: purple;
        padding: 5px;
      }
      #test-editor {
        padding: 20px;
        border: 1px solid #333;
        margin: 10px;
      }
      #test-editor.edit-mode {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body class="dark-mode">
    <div id="test-editor">
      This is plain text

      <h3>This is html markup</h3>
    </div>
    <button id="preview-edit">EDIT</button>

    <script src="../assets/js/markdown-it.js"></script>

    <script type="module">
      import { state } from '../assets/js/state.js'

      const previewEditBtn = document.getElementById('preview-edit')
      const editor = document.getElementById('test-editor')

      document.addEventListener('DOMContentLoaded', async () => {
        state.set('editor-content', editor.innerHTML)
        listen()

        /**
         *
         */
        function listen() {
          previewEditBtn.addEventListener('click', handlePreviewEditClick)
        }

        /**
         *
         */
        function handlePreviewEditClick() {
          if (previewEditBtn.innerHTML === 'PREVIEW') {
            previewEditBtn.innerHTML = 'EDIT'
            setPreviewMode()
          } else {
            previewEditBtn.innerHTML = 'PREVIEW'
            setEditMode()
          }
        }

        /**
         *
         */
        function setPreviewMode() {
          const source = editor.innerText
          state.set('editor-content', source)

          editor.classList.remove('edit-mode')
          editor.contentEditable = 'false'
          editor.innerHTML = source
        }

        /**
         *
         */
        function setEditMode() {
          editor.classList.add('edit-mode')
          editor.contentEditable = 'plaintext-only'
          editor.textContent = state.get('editor-content')
        }
      })
    </script>
  </body>
</html>
